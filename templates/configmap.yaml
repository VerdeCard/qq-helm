{{- $configMaps := default dict .Values.configMaps -}}
{{- $legacy := default dict .Values.configmap -}}
{{- if or $configMaps.create $legacy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm_template.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "helm_template.labels" . | indent 4 }}
data:
{{- $data := default $legacy.data $configMaps.data }}
{{ toYaml $data | indent 2 }}
{{- end }}

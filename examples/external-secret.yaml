fullnameOverride: app-secret

container:
  env:
    fromSecrets:
      - name: DATABASE_PASSWORD
        secretName: app-db-secret
        key: password

volumes:
  existing:
    - name: app-certificates
      type: secret
      secretName: app-tls-secret
      mountPath: /etc/tls
      readOnly: true

service:
  enabled: true
